version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify env vars are only available at build time; write them to
        # .env.production so the Next.js SSR runtime can read them.
        - env | grep -E '^(CPANEL_EMAIL_|EMAIL_RECEIVER|NEXT_PUBLIC_)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*

